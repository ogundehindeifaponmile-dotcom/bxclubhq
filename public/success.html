<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BXCLUB | Order Confirmed</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fff; color: #0a0a0a; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .container { max-width: 500px; text-align: center; }
        h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 3rem; margin-bottom: 16px; }
        p { color: #888; letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 32px; }
        .order-details { text-align: left; border-top: 1px solid #eee; padding-top: 24px; margin-top: 24px; }
        .order-details p { text-transform: none; letter-spacing: 0; color: #0a0a0a; font-size: 0.9rem; margin-bottom: 8px; }
        a { display: inline-block; margin-top: 32px; color: #0a0a0a; text-decoration: none; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; border-bottom: 1px solid #0a0a0a; padding-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thank You</h1>
        <p>Your order has been confirmed</p>
        <div id="order-info" class="order-details"></div>
        <a href="/">Continue Shopping</a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('session_id');
        if (sessionId) {
            fetch(`/api/orders/session/${sessionId}`)
                .then(r => r.json())
                .then(order => {
                    document.getElementById('order-info').innerHTML = `
                        <p><strong>Order ID:</strong> ${order._id}</p>
                        <p><strong>Total:</strong> $${order.total.toFixed(2)}</p>
                        <p><strong>Shipping to:</strong> ${order.customer.address}, ${order.customer.city}</p>
                        <p style="color:#888; font-size:0.8rem; margin-top:16px;">A confirmation email has been sent to ${order.customer.email}</p>
                    `;
                })
                .catch(() => {
                    document.getElementById('order-info').innerHTML = `<p>Order is being processed. You'll receive an email shortly.</p>`;
                });
        }
    </script>
</body>
</html>
